name: Build
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Install EarthBuild
        uses: ./.github/actions/install-earthbuild
      - run: earth --artifact --allow-privileged --ci +build/ --XSA_FILE=design_1_wrapper.xsa /tmp/build
        env:
          EARTH_MAX_REMOTE_CACHE: ${{ github.ref == 'refs/heads/main' }}
          EARTH_PUSH: ${{ github.ref == 'refs/heads/main' }}
          EARTH_REMOTE_CACHE: ghcr.io/tosainu/earthly-zynqmp-example:build-cache
          FORCE_COLOR: true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build
          path: /tmp/build
